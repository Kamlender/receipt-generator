name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAGoLkvlhFZEh7ITW1f7X6ZSxKGSzSm1QM
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: receipt-generator-b4026.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: receipt-generator-b4026
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: receipt-generator-b4026.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "27015668435"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:27015668435:web:e0def4b2e36ebdcbef6a26"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
